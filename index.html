<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSTL | Data Space Technologies Limited</title>
    <meta name="description" content="Empowering Smarter Decisions Through Data & AI" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              dstl: {
                dark: '#02040F', // Deepest Blue/Black from logo background
                navy: '#050A1F', // Secondary Deep Navy
                purple: '#0A1A40', // Remapped 'purple' to a Deep Royal Blue to match logo theme
                blue: '#0055FF', // Vibrant Royal Blue (matches the 'T' and 'D' gradient)
                cyan: '#00D8FF', // Bright Electric Cyan (matches the nodes)
                teal: '#00E5FF', // Secondary Cyan
                accent: '#00D8FF', // Primary CTA color (Electric Cyan)
                silver: '#E0E7FF', // Silver/White for light accents
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #02040F; /* Matches dstl-dark */
        color: #f8fafc;
      }
      .glass-card {
        background: rgba(5, 10, 31, 0.6); /* Matches dstl-navy with opacity */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .text-gradient {
        /* Updated gradient: Electric Cyan to Royal Blue */
        background: linear-gradient(to right, #00D8FF, #0055FF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .bg-grid-pattern {
        background-size: 40px 40px;
        /* Updated grid color to Cyan */
        background-image: linear-gradient(to right, rgba(0, 216, 255, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(0, 216, 255, 0.05) 1px, transparent 1px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
