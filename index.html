<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSTL | Data Space Technologies Limited</title>
    <meta name="description" content="Empowering Smarter Decisions Through Data & AI" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              dstl: {
                dark: '#050329', // Deep indigo background from logo
                navy: '#0C0F3C', // Secondary dark blue
                purple: '#232E8F', // Indigo glow tone from logo backdrop
                blue: '#2E69FF', // Royal blue from DSTL letter gradient
                cyan: '#62E3F5', // Bright cyan from node marks and accents
                teal: '#4AD8D8', // Technology text cyan tone
                accent: '#62E3F5', // Primary CTA color aligned to logo highlights
                silver: '#E8ECFF', // Light silver-white used in DSTL lettering
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050329; /* Matches dstl-dark */
        color: #f8fafc;
      }
      .glass-card {
        background: rgba(12, 15, 60, 0.6); /* Matches dstl-navy with opacity */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .text-gradient {
        background: linear-gradient(to right, #62E3F5, #2E69FF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .bg-grid-pattern {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(98, 227, 245, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(98, 227, 245, 0.05) 1px, transparent 1px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<script type="module" src="/index.tsx"></script>

  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
  </body>
</html>
